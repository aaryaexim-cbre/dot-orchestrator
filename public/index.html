<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Response Orchestrator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <p class="eyebrow">Side-by-side AI comparison</p>
        <h1>Ask once. Compare assumptions.</h1>
        <p class="subtitle">Two models answer the same question, then a synthesis card highlights where their assumptions align, conflict, or need one better follow-up.</p>
      </section>

      <form class="prompt-form" id="prompt-form">
        <label for="message">Your question</label>
        <div class="input-row">
          <input id="message" name="message" type="text" placeholder="What is the best way to prioritize this product roadmap?" autocomplete="off" />
          <button type="submit" id="submit-button">Run comparison</button>
        </div>
      </form>

      <section class="response-grid" aria-live="polite">
        <article class="response-card" id="openrouter-a-card">
          <div class="card-header">
            <h2>Model A</h2>
            <span class="status idle">idle</span>
          </div>
          <dl class="structured-response"></dl>
        </article>
        <article class="response-card" id="openrouter-b-card">
          <div class="card-header">
            <h2>Model B</h2>
            <span class="status idle">idle</span>
          </div>
          <dl class="structured-response"></dl>
        </article>
      </section>

      <section class="insight-card" id="insight-card" aria-live="polite">
        <div class="card-header">
          <h2>Insight Card</h2>
          <span class="status idle">idle</span>
        </div>
        <dl class="structured-response"></dl>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
